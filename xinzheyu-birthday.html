<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050816">
<title>8月21日 · 寄给小哲毓</title>
<style>
  :root{
    --night1:#050816; --night2:#0d1430; --night3:#1b1f3a;
    --star:#e8ecff; --accent:#e05a6d; --gold:#f2c14e;
    --ink:#eef1ff; --dim:#aab3d9;
  }
  /* 预留内嵌字体：把字体文件放进 fonts/ 目录即自动启用（缺省时回退到系统楷体/宋体） */
  @font-face{font-family:"TitleScript";src:url("fonts/mashanzheng.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"BodySerif";src:url("fonts/notoserifsc.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"BodySerif";src:url("fonts/notoserifsc-semibold.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"JpMincho";src:url("fonts/notoserifjp.woff2") format("woff2");font-weight:400;font-display:swap}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:linear-gradient(160deg,var(--night1) 0%,var(--night2) 55%,var(--night3) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"BodySerif","Noto Serif SC","Source Han Serif SC","Songti SC","SimSun","宋体",serif;
    overflow-x:hidden;
  }
  [hidden]{display:none!important}
  #sky{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity 1.8s ease}
  #sky.dim{opacity:.22}
  #videobg{
    position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity 1.8s ease;pointer-events:none;background:#050816;
  }
  #videobg.on{opacity:1}
  .wrap{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
  section{display:none;width:100%;max-width:640px;text-align:center}
  section.active{display:block;animation:fadeIn 1.1s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  .title{font-family:"TitleScript","Kaiti SC","KaiTi","STKaiti","楷体","FangSong","仿宋",serif}
  .jp{font-family:"JpMincho","Noto Serif JP","Yu Mincho","YuGothic","Hiragino Mincho ProN",serif}
  .serif{font-family:"BodySerif","Noto Serif SC","Source Han Serif SC","Songti SC","SimSun","宋体",serif}
  /* ---------- 门 ---------- */
  #gate .stamp{
    display:inline-block;border:1.5px solid var(--accent);color:var(--accent);
    padding:8px 18px;border-radius:2px;letter-spacing:.35em;font-size:13px;margin-bottom:26px;
  }
  #gate h1{font-size:clamp(26px,6vw,40px);font-weight:600;letter-spacing:.12em;line-height:1.5}
  #gate .sub{color:var(--dim);margin-top:14px;font-size:14px;letter-spacing:.18em}
  .pass-row{margin-top:34px;display:flex;justify-content:center;gap:10px;align-items:center}
  #pin{
    width:150px;padding:13px 8px;text-align:center;font-size:24px;letter-spacing:.55em;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);border-radius:8px;
    color:var(--ink);outline:none;caret-color:var(--accent);
  }
  #pin:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,90,109,.18)}
  #unlock{
    padding:13px 26px;border:none;border-radius:8px;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),#b8435c);color:#fff;
    font-size:16px;letter-spacing:.2em;font-family:inherit;
  }
  #unlock:active{transform:scale(.97)}
  #hint{color:var(--dim);font-size:13px;margin-top:16px;min-height:20px;letter-spacing:.1em}
  #hint.err{color:var(--accent)}
  .shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  /* ---------- 流星 ---------- */
  .quote{font-size:clamp(20px,5.4vw,30px);line-height:2;letter-spacing:.12em;color:var(--ink)}
  .quote .caret{display:inline-block;width:2px;height:1.05em;background:var(--gold);vertical-align:-.15em;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .skip-tip{color:var(--dim);font-size:12px;margin-top:22px;letter-spacing:.2em;opacity:.7}
  /* ---------- 名字 ---------- */
  #name-stage .cord{width:min(260px,70vw);margin:0 auto 30px}
  #name-stage .ask{font-size:clamp(22px,6vw,34px);letter-spacing:.18em;color:var(--dim)}
  #name-stage .reveal{
    font-size:clamp(30px,8vw,52px);font-weight:700;letter-spacing:.14em;color:var(--gold);
    margin-top:26px;text-shadow:0 0 24px rgba(242,193,78,.35);
  }
  /* ---------- 信 ---------- */
  .letter-card{
    background:rgba(5,8,22,.58);border:1px solid rgba(255,255,255,.14);
    border-radius:16px;padding:32px 28px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 12px 46px rgba(0,0,0,.35);
  }
  .letter{
    max-width:520px;margin:0 auto;text-align:left;
    font-size:clamp(15px,3.8vw,17px);line-height:2.1;color:#e6e9ff;
  }
  .letter .jp-line{text-align:center;font-size:1.06em;color:var(--gold);letter-spacing:.08em;margin:18px 0}
  .letter .sig{text-align:right;margin-top:18px;color:var(--dim);font-size:.92em;letter-spacing:.06em}
  .bday{font-size:clamp(24px,6.5vw,38px);font-weight:700;letter-spacing:.2em;color:var(--accent);margin:34px 0 0;animation:pulse 2.4s ease infinite}
  @keyframes pulse{0%,100%{text-shadow:0 0 12px rgba(224,90,109,.25)}50%{text-shadow:0 0 30px rgba(224,90,109,.7)}}
  .gift-tip{color:var(--dim);font-size:14px;letter-spacing:.18em;margin-top:30px}
  #gift-btn{
    margin-top:14px;padding:12px 30px;border:1px solid var(--gold);color:var(--gold);
    background:transparent;border-radius:30px;cursor:pointer;font-size:15px;letter-spacing:.25em;font-family:inherit;
  }
  #gift-btn:hover{background:rgba(242,193,78,.1)}
  #gift-btn:active{transform:scale(.97)}
  #gift-reveal{margin-top:14px;color:var(--dim);font-size:13px;letter-spacing:.12em;animation:fadeIn .8s ease both}
  #replay{
    margin-top:30px;padding:12px 26px;border:1px solid rgba(255,255,255,.3);border-radius:30px;
    background:transparent;color:var(--ink);cursor:pointer;font-size:14px;letter-spacing:.2em;font-family:inherit;
  }
  #replay:hover{background:rgba(255,255,255,.08)}
  .fade-in{animation:fadeIn 1.2s ease both}
  /* ---------- 静音开关 ---------- */
  #muteBtn{
    position:fixed;top:14px;right:16px;z-index:5;width:40px;height:40px;border-radius:50%;
    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:var(--ink);
    font-size:16px;cursor:pointer;font-family:inherit;line-height:1;
  }
  #muteBtn.muted{opacity:.5}
  @media (max-width:480px){
    .letter-card{padding:24px 18px}
    .pass-row{flex-direction:column}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<video id="videobg" muted loop playsinline preload="auto" src="video2.mp4"></video>
<button id="muteBtn" type="button" aria-label="静音开关">♪</button>
<audio id="bgm" loop preload="auto" src="music.mp3"></audio>
<div class="wrap">

  <!-- 门 -->
  <section id="gate" class="active">
    <div class="stamp">自动手记人偶 · AUTO MEMORIES DOLL</div>
    <h1 class="title">有一封来自<br>8月21日的信</h1>
    <p class="sub">— 请输入开启密码 —</p>
    <div class="pass-row">
      <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="····" autocomplete="off">
      <button id="unlock" type="button">开启</button>
    </div>
    <p id="hint">请输入四位密码</p>
  </section>

  <!-- 流星与台词 -->
  <section id="meteor-stage">
    <p class="quote"><span id="quote-text"></span><span class="caret" id="caret1"></span></p>
    <p class="skip-tip">轻触屏幕,可让文字快进</p>
  </section>

  <!-- 名字 -->
  <section id="name-stage">
    <svg class="cord" viewBox="0 0 260 60" fill="none" aria-hidden="true">
      <path d="M6 30 C 40 4, 70 56, 104 30 S 168 4, 202 30 S 236 56, 254 30" stroke="#d9534f" stroke-width="7" stroke-linecap="round"/>
      <path d="M6 30 C 40 4, 70 56, 104 30 S 168 4, 202 30 S 236 56, 254 30" stroke="#f2c14e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 8"/>
      <path d="M6 30 C 40 56, 70 4, 104 30 S 168 56, 202 30 S 236 4, 254 30" stroke="#e05a6d" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12"/>
    </svg>
    <p class="ask jp" id="ask-text"></p>
    <p class="reveal title" id="reveal-name"></p>
  </section>

  <!-- 信 -->
  <section id="letter-stage">
    <div class="letter-card">
    <div class="letter serif">
      <p>我是自动手记人偶。</p>
      <p>今晚的委托，来自一位不愿署名的委托人：</p>
      <p>有一句祝福，定于8月21日准时送达。</p>
      <p class="jp-line jp">「大切な人、忘れたくない人、忘れちゃいけない人。」</p>
      <p>收信人——又长大一岁的小哲毓。</p>
      <p>纵前路暂未明朗，步履不停自有答案。</p>
      <p>生日快乐，小哲毓。</p>
      <p class="sig">——自动手记人偶 • Violet·Evergarden</p>
    </div>
    <p class="bday title">生 日 快 乐</p>
    <p class="gift-tip">门外，还有一件礼物在等你。</p>
    <button id="gift-btn" type="button">去拆礼物吧</button>
    <p id="gift-reveal" hidden>它就在你手边——连上电，让它替我说第一句话。</p>
    <button id="replay" type="button">再看一遍流星</button>
    </div>
  </section>

</div>
<script>
(function(){
  "use strict";
  var PIN = "0821";
  var sky = document.getElementById("sky"), ctx = sky.getContext("2d");
  var video = document.getElementById("videobg");
  var bgm = document.getElementById("bgm");
  var W, H, stars = [], nebulas = [], meteors = [], raf = null;

  /* ---------- 星空：星云 + 呼吸星星 ---------- */
  var NEBULA_COLORS = [
    "rgba(94,116,190,A)", "rgba(122,102,180,A)",
    "rgba(186,100,132,A)", "rgba(80,140,160,A)"
  ];
  function resize(){
    W = sky.width  = window.innerWidth  * devicePixelRatio;
    H = sky.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    W = window.innerWidth; H = window.innerHeight;   // CSS px
    initStars(); initNebulas();
  }
  function initStars(){
    stars = [];
    var n = Math.min(180, Math.floor(W * H / 5600));
    for (var i = 0; i < n; i++){
      stars.push({
        x: Math.random()*W, y: Math.random()*H,
        r: Math.random()*1.4+0.4, p: Math.random()*Math.PI*2,
        s: Math.random()*0.018+0.006,
        big: Math.random() < 0.14
      });
    }
  }
  function initNebulas(){
    nebulas = [];
    for (var i = 0; i < NEBULA_COLORS.length; i++){
      nebulas.push({
        x: Math.random()*W, y: Math.random()*H,
        r: 130 + Math.random()*190,
        ax: Math.random()*0.5+0.15, ay: Math.random()*0.4+0.1,
        ph: Math.random()*Math.PI*2,
        color: NEBULA_COLORS[i]
      });
    }
  }
  function spawnMeteor(shower){
    var fromLeft = Math.random() > 0.5;
    var x = fromLeft ? Math.random()*W*0.25 : W - Math.random()*W*0.25;
    var y = Math.random()*H*0.3;
    var vx = (fromLeft ? 1 : -1) * (6 + Math.random()*4 + (shower?3:0));
    var vy = 2.4 + Math.random()*1.6 + (shower?1.4:0);
    var life = 1;
    meteors.push({ x:x, y:y, vx:vx, vy:vy, life:life, decay:0.008 + Math.random()*0.008, len: (shower? 90: 60) + Math.random()*40 });
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    var nt = t/1000;
    // 星云：缓慢漂移的光晕
    for (var k = 0; k < nebulas.length; k++){
      var nb = nebulas[k];
      var x = nb.x + Math.sin(nt*nb.ax + nb.ph) * 46;
      var y = nb.y + Math.cos(nt*nb.ay + nb.ph) * 34;
      var pr = 0.9 + 0.1*Math.sin(nt*0.4 + nb.ph);
      var g = ctx.createRadialGradient(x, y, 0, x, y, nb.r*pr);
      g.addColorStop(0, nb.color.replace("A", "0.15"));
      g.addColorStop(1, nb.color.replace("A", "0"));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, nb.r*pr, 0, Math.PI*2); ctx.fill();
    }
    // 星星：呼吸明暗，少数大星会闪亮
    for (var i = 0; i < stars.length; i++){
      var st = stars[i];
      var tw = 0.35 + 0.65*Math.abs(Math.sin(t*st.s*1000 + st.p));
      ctx.globalAlpha = (st.big ? 0.55 : 0.3) + 0.6*tw;
      ctx.fillStyle = st.big ? "#ffffff" : "#e8ecff";
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r*(st.big?1.5:1), 0, Math.PI*2); ctx.fill();
      if (st.big && tw > 0.92){
        ctx.globalAlpha = 0.25*(tw-0.92)*6;
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r*4, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    // 流星
    for (var j = meteors.length-1; j >= 0; j--){
      var m = meteors[j];
      m.x += m.vx; m.y += m.vy; m.life -= m.decay;
      if (m.life <= 0 || m.x < -200 || m.x > W+200 || m.y > H+120){ meteors.splice(j,1); continue; }
      var grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx*m.len/6, m.y - m.vy*m.len/6);
      grad.addColorStop(0, "rgba(255,255,255," + Math.min(1,m.life) + ")");
      grad.addColorStop(0.3, "rgba(224,90,109," + (0.55*m.life) + ")");
      grad.addColorStop(1, "rgba(224,90,109,0)");
      ctx.strokeStyle = grad; ctx.lineWidth = 1.6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.vx*m.len/6, m.y - m.vy*m.len/6); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255," + m.life + ")";
      ctx.beginPath(); ctx.arc(m.x, m.y, 1.8, 0, Math.PI*2); ctx.fill();
    }
    raf = requestAnimationFrame(draw);
  }
  resize();
  window.addEventListener("resize", resize);
  raf = requestAnimationFrame(draw);
  setInterval(function(){ if (document.visibilityState === "visible") spawnMeteor(false); }, 2600);

  /* ---------- 舞台 ---------- */
  var sections = Array.prototype.slice.call(document.querySelectorAll("section"));
  function show(id){
    sections.forEach(function(s){ s.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
  }
  function typeInto(el, text, speed, done){
    var i = 0;
    el.textContent = "";
    (function step(){
      if (i < text.length){ el.textContent = text.slice(0, ++i); setTimeout(step, speed); }
      else if (done) done();
    })();
    return function(){ i = text.length; el.textContent = text; if (done) done(); };
  }

  /* 解锁音(轻柔三音) */
  function chime(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      var ac = new AC(), now = ac.currentTime;
      [523.25, 659.25, 783.99].forEach(function(f, k){
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, now + k*0.16);
        g.gain.exponentialRampToValueAtTime(0.12, now + k*0.16 + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, now + k*0.16 + 0.9);
        o.connect(g); g.connect(ac.destination);
        o.start(now + k*0.16); o.stop(now + k*0.16 + 1);
      });
    }catch(e){}
  }

  /* 背景音乐：解锁后开始播放；文件缺失时静默降级 */
  function startMusic(){
    try{
      var p = bgm.play();
      if (p && p.catch) p.catch(function(){});
    }catch(e){}
  }
  var muteBtn = document.getElementById("muteBtn");
  muteBtn.addEventListener("click", function(){
    bgm.muted = !bgm.muted;
    muteBtn.classList.toggle("muted", bgm.muted);
    muteBtn.textContent = bgm.muted ? "✕♪" : "♪";
    if (!bgm.muted) startMusic();
  });

  /* 末屏视频背景：进入信件时星空淡出、视频淡入；文件缺失时隐藏 */
  video.addEventListener("error", function(){ video.style.display = "none"; });
  function enterVideo(){
    sky.classList.add("dim");
    var p = video.play();
    if (p && p.then){
      p.then(function(){ video.classList.add("on"); }).catch(function(){ video.style.display = "none"; });
    } else {
      video.classList.add("on");
    }
  }
  function leaveVideo(){
    sky.classList.remove("dim");
    video.classList.remove("on");
    try{ video.pause(); }catch(e){}
  }

  function unlock(){
    show("meteor-stage");
    chime();
    startMusic();
    for (var i = 0; i < 12; i++) setTimeout(function(){ spawnMeteor(true); }, i*180);
    setTimeout(function(){
      var finish = typeInto(document.getElementById("quote-text"),
        "大切な人、忘れたくない人、忘れちゃいけない人。", 110, function(){
          setTimeout(function(){ gotoName(); }, 1400);
        });
      document.getElementById("meteor-stage").addEventListener("click", function h(){
        finish(); this.removeEventListener("click", h);
      }, { once:false });
    }, 900);
  }
  function gotoName(){
    show("name-stage");
    var askEl = document.getElementById("ask-text");
    var doneAsk = typeInto(askEl, "君の名前は——", 90, function(){
      setTimeout(function(){
        var r = document.getElementById("reveal-name");
        r.textContent = "又长大一岁的小哲毓";
        r.classList.add("fade-in");
        setTimeout(function(){ gotoLetter(); }, 3200);
      }, 500);
    });
    var tap = function(){ doneAsk(); };
    document.getElementById("name-stage").addEventListener("click", tap, { once:true });
  }
  function gotoLetter(){
    show("letter-stage");
    enterVideo();
    document.getElementById("letter-stage").scrollIntoView({ behavior:"smooth", block:"center" });
  }

  /* ---------- 门交互 ---------- */
  var pin = document.getElementById("pin"), unlockBtn = document.getElementById("unlock"),
      hint = document.getElementById("hint"), gate = document.getElementById("gate");
  function tryUnlock(){
    if (pin.value === PIN){
      hint.textContent = "信,正在穿越星海……";
      setTimeout(unlock, 600);
    } else {
      hint.textContent = "密码不对——想想看,今天是你的生日";
      hint.classList.add("err");
      gate.classList.remove("shake"); void gate.offsetWidth; gate.classList.add("shake");
      pin.value = ""; pin.focus();
    }
  }
  unlockBtn.addEventListener("click", tryUnlock);
  pin.addEventListener("keydown", function(e){ if (e.key === "Enter") tryUnlock(); });
  pin.addEventListener("input", function(){ if (pin.value.length === 4) tryUnlock(); });

  /* ---------- 信末引导 ---------- */
  var giftBtn = document.getElementById("gift-btn"), giftReveal = document.getElementById("gift-reveal");
  giftBtn.addEventListener("click", function(){
    giftReveal.hidden = false;
    giftBtn.textContent = "礼物已就位";
    giftBtn.disabled = true;
    giftBtn.style.opacity = ".55";
  });

  document.getElementById("replay").addEventListener("click", function(){
    leaveVideo();
    document.getElementById("reveal-name").classList.remove("fade-in");
    document.getElementById("reveal-name").textContent = "";
    giftReveal.hidden = true;
    giftBtn.textContent = "去拆礼物吧";
    giftBtn.disabled = false;
    giftBtn.style.opacity = "";
    unlock();
  });
})();
</script>
</body>
</html>
